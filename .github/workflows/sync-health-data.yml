name: Sync Fitbit to Notion

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # Allow manual triggering

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test BOT_PAT permissions
        env:
          BOT_PAT: ${{ secrets.BOT_PAT }}
        run: |
          echo "Testing BOT_PAT can access GitHub Secrets API..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $BOT_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/secrets/public-key)
          echo "GitHub Secrets API response: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "ERROR: BOT_PAT does not have Secrets permission (got $STATUS, expected 200)"
            exit 1
          fi
          echo "OK: BOT_PAT has Secrets permission"

      - name: Run sync script
        env:
          FITBIT_CLIENT_ID: ${{ secrets.FITBIT_CLIENT_ID }}
          FITBIT_CLIENT_SECRET: ${{ secrets.FITBIT_CLIENT_SECRET }}
          FITBIT_ACCESS_TOKEN: ${{ secrets.FITBIT_ACCESS_TOKEN }}
          FITBIT_REFRESH_TOKEN: ${{ secrets.FITBIT_REFRESH_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BOT_PAT: ${{ secrets.BOT_PAT }}
        run: python sync_fitbit_notion.py
